<!doctype html>
<html lang="en">
<head>
<meta charset=utf-8>
<meta name=viewport content=width=device-width,initial-scale=1>
<title>AniGlobe</title>
<meta name="description" content="Make a shareable anime or manga wrap, then play the daily title-guessing game.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"> <!-- taste-skill-ignore: mono loads for figures and keys, the one mono job -->
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<a class="skip-link" href="#app">Skip to the tool</a>

<div class="site-layout">
  <aside class="site-sidebar" aria-label="AniGlobe">
    <a class="brand" id="brand" href="#/"></a>
    <p class="sidebar-caption">Tools</p>
    <nav class="site-nav" id="nav" aria-label="AniGlobe tools"></nav>
    <div class="sidebar-foot">
      <p>Works from public MyAnimeList and AniList profiles. Nothing you enter leaves this browser.</p>
    </div>
  </aside>

  <div class="sheet">
    <header class="mobile-header">
      <a class="brand" id="mobile-brand" href="#/"></a>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="mobile-nav-dialog">
        <span class="nav-toggle-mark" aria-hidden="true"></span>
        <span>Tools</span>
      </button>
      <dialog class="nav-dialog" id="mobile-nav-dialog" aria-labelledby="mobile-nav-title">
        <div class="nav-dialog-head">
          <h2 id="mobile-nav-title">Tools</h2>
          <button class="nav-close" id="nav-close" type="button">Close</button>
        </div>
        <nav class="mobile-nav" id="mobile-nav" aria-label="AniGlobe tools"></nav>
      </dialog>
    </header>

    <main class="app" id="app" tabindex="-1"></main>

    <footer class="site-footer">
      <div class="footer-inner" id="footer"></div>
    </footer>
  </div>
</div>

<noscript>
  <p class="noscript">AniGlobe needs JavaScript. Wrapped reads public profiles from MyAnimeList or AniList.</p>
</noscript>

<script type=module src=src/app.js></script>
</body>
</html>
